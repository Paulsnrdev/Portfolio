<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Portfolio Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <div class="login-logo">Portfolio Admin</div>
        <p class="login-sub">Sign in to manage your site.</p>
        <form id="loginForm">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log In</button>
            <p class="login-error" id="loginError"></p>
        </form>
    </div>
</div>
<script src="/admin/api.js"></script>
<script src="/admin/login.js"></script>
</body>
</html>
